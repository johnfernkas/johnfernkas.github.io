<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="/feed.xml">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  {% seo %}
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo" aria-label="John Fernkas — Home">
      <svg class="crest" viewBox="0 0 240 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
        <defs>
          <clipPath id="shield-clip">
            <path d="M35,35 L205,35 L205,165 Q205,242 120,268 Q35,242 35,165 Z"/>
          </clipPath>
        </defs>

        <!-- Shield filled -->
        <path d="M35,35 L205,35 L205,165 Q205,242 120,268 Q35,242 35,165 Z"
              fill="var(--crest-primary)"/>

        <!-- Inner inset border in cream -->
        <path d="M44,44 L196,44 L196,163 Q196,232 120,257 Q44,232 44,163 Z"
              fill="none" stroke="var(--crest-on-primary)" stroke-width="1" opacity="0.65" stroke-linejoin="round"/>

        <!-- F monogram clipped to shield -->
        <text x="100" y="162" text-anchor="middle" dominant-baseline="middle"
              font-family="'Pinyon Script', cursive" font-size="95"
              fill="var(--crest-on-primary)" clip-path="url(#shield-clip)">F</text>

      </svg>
    </a>
  </header>

  {{ content }}

  <footer>
    <div class="footer-links">
      <a href="https://github.com/johnfernkas">GitHub</a>
      <a href="https://www.linkedin.com/in/johnfernkas">LinkedIn</a>
      <a href="mailto:john@johnfernkas.com">john@johnfernkas.com</a>
    </div>
    &copy; {{ 'now' | date: '%Y' }} John Fernkas
  </footer>
</body>
</html>
